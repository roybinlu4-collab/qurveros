name: BARQ 50-seed research benchmark

on:
  push:
    branches:
      - feature/state-compatibility-transmon
    paths:
      - "examples/barq_hardware_aware_benchmark.py"
      - "examples/barq_publication_figures.py"
      - ".github/workflows/barq-50seed-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "true"
      BARQ_BENCHMARK_SEEDS: "50"
      BARQ_BENCHMARK_ITERS: "10000"
      BARQ_BENCHMARK_OPT_POINTS: "512"
      BARQ_BENCHMARK_LEAKAGE_ITERS: "2500"
      BARQ_BENCHMARK_LEAKAGE_WEIGHT: "0.5"
      BARQ_HEATMAP_N: "41"
      BARQ_FIGURE_CONTROL_POINTS: "1024"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run 50-seed matched benchmark
        run: python examples/barq_hardware_aware_benchmark.py
      - name: Generate publication Figures 2--6
        run: python examples/barq_publication_figures.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: barq-50seed-publication-results
          path: |
            barq_hardware_aware_benchmark.csv
            barq_hardware_aware_summary.json
            publication_results/
