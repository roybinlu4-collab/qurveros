name: Paper-scale BARQ research results

on:
  push:
    branches:
      - research/50seed-paper-results
    paths:
      - "research/**"
      - ".github/workflows/paper-results.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPER_SEEDS: "50"
      PAPER_ITERS: "10000"
      PAPER_LEAKAGE_ITERS: "2500"
      PAPER_OPT_POINTS: "512"
      PAPER_LEAKAGE_WEIGHT: "0.5"
      PAPER_OUTDIR: "research_outputs"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run matched-seed benchmark
        run: python research/paper_benchmark.py
      - name: Generate Figures 2-6
        run: python research/make_paper_figures.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: barq-paper-results
          path: research_outputs
