name: Hardware-aware BARQ extension CI

on:
  push:
    branches:
      - feature/state-compatibility-transmon
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BARQ_BENCHMARK_SEEDS: "3"
      BARQ_BENCHMARK_ITERS: "150"
      BARQ_BENCHMARK_OPT_POINTS: "128"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run pilot benchmark
        run: python examples/barq_hardware_aware_benchmark.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: hardware-aware-barq-benchmark
          path: |
            barq_hardware_aware_benchmark.csv
            barq_hardware_aware_summary.json
